name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      destination:
        description: Package feeds to publish to
        required: true
        type: choice
        default: both
        options:
          - both
          - github

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match the package version: v$version"
          }
      - name: Test
        run: dotnet test tests/FeatureManagement.UI.Tests/FeatureManagement.UI.Tests.csproj -c Release
      - name: Pack libraries
        shell: pwsh
        run: |
          $projects = Get-ChildItem src -Recurse -Filter *.csproj
          foreach ($project in $projects) {
            dotnet pack $project.FullName -c Release -o ./artifacts -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Packing failed: $($project.Name)" }
          }
          if ((Get-ChildItem artifacts -Filter *.nupkg).Count -ne $projects.Count) {
            throw "Expected one package per library."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  github:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "$GITHUB_TOKEN" --skip-duplicate

  nuget:
    if: github.event_name == 'push' || inputs.destination == 'both'
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
